<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><style>@keyframes pulseGlow{0%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-15px) rotate(180deg);opacity:.7}}@keyframes scanline{0%{transform:translateY(-200px)}}.animated-glow{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.particle-1{animation:floatParticle 8s ease-in-out infinite}.particle-2{animation:floatParticle 11s ease-in-out infinite 2s}.particle-3{animation:floatParticle 9s ease-in-out infinite 4s}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:56px;fill:url(#text-gradient)}.subtitle-text{font-weight:500;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}</style></defs><rect width="1200" height="400" fill="url(#bg-gradient)" rx="16"/><circle cx="300" cy="200" r="250" fill="url(#glow)" class="animated-glow"/><circle cx="900" cy="150" r="200" fill="url(#glow)" class="animated-glow" style="animation-delay:3s"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400"/></g><g class="particle-1"><circle cx="150" cy="100" r="6" fill="#6366f1" opacity=".6"/><circle cx="150" cy="100" r="14" fill="none" stroke="#6366f1" stroke-width="1.5" opacity=".4"/></g><g class="particle-2"><circle cx="1050" cy="280" r="8" fill="#a855f7" opacity=".6"/><circle cx="1050" cy="280" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity=".4"/></g><g class="particle-3"><circle cx="980" cy="90" r="5" fill="#ec4899" opacity=".6"/></g><g filter="url(#shadow)" transform="translate(600, 105) scale(0.9)"><path fill="none" stroke="url(#accent-gradient)" stroke-width="4" d="M 0 -50 L 35 -30 L 35 15 C 35 40 0 55 0 55 C 0 55 -35 40 -35 15 L -35 -30 Z"/><path fill="url(#accent-gradient)" d="M 0 -40 L 26 -24 L 26 12 C 26 32 0 44 0 44 C 0 44 -26 32 -26 12 L -26 -24 Z" opacity=".25"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M -10 2 L -3 9 L 12 -6"/></g><rect width="280" height="32" x="460" y="35" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="600" y="56" class="badge-text" text-anchor="middle">🛡️ AI SAFETY &amp; SECURITY ECOSYSTEM</text><text x="600" y="215" class="title-text" filter="url(#shadow)" text-anchor="middle">Awesome AI Guardrails</text><rect width="300" height="4" x="450" y="235" fill="url(#accent-gradient)" rx="2"/><text x="600" y="280" class="subtitle-text" text-anchor="middle">Curated List of SaaS Platforms &amp; Open-Source AI Safety Frameworks</text><g transform="translate(310, 320)"><rect width="160" height="32" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="80" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">🔒 Prompt Injection</text><rect width="160" height="32" x="180" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="260" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">⚡ Runtime Control</text><rect width="220" height="32" x="360" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="470" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">🤖 Safe Agent Behavior</text></g></svg>