<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
        50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
        100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
      }
      @keyframes scanline {
        0% { transform: translateY(-200px); }
        100% { transform: translateY(400px); }
      }
      .animated-glow {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .particle-1 { animation: floatParticle 8s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 11s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 9s ease-in-out infinite 4s; }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: url(#text-gradient);
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)" />

  <!-- Dynamic Glowing Orbs -->
  <circle cx="300" cy="200" r="250" fill="url(#glow)" class="animated-glow" />
  <circle cx="900" cy="150" r="200" fill="url(#glow)" class="animated-glow" style="animation-delay: 3s;" />

  <!-- Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Decorative Dynamic Tech Nodes -->
  <g class="particle-1">
    <circle cx="150" cy="100" r="6" fill="#6366f1" opacity="0.6"/>
    <circle cx="150" cy="100" r="14" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
  <g class="particle-2">
    <circle cx="1050" cy="280" r="8" fill="#a855f7" opacity="0.6"/>
    <circle cx="1050" cy="280" r="18" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
  <g class="particle-3">
    <circle cx="980" cy="90" r="5" fill="#ec4899" opacity="0.6"/>
  </g>

  <!-- Shield Icon Graphic -->
  <g transform="translate(600, 105) scale(0.9)" filter="url(#shadow)">
    <!-- Outer Shield Outline -->
    <path d="M 0 -50 L 35 -30 L 35 15 C 35 40 0 55 0 55 C 0 55 -35 40 -35 15 L -35 -30 Z" fill="none" stroke="url(#accent-gradient)" stroke-width="4" />
    <!-- Inner Shield Glowing Core -->
    <path d="M 0 -40 L 26 -24 L 26 12 C 26 32 0 44 0 44 C 0 44 -26 32 -26 12 L -26 -24 Z" fill="url(#accent-gradient)" opacity="0.25" />
    <!-- Lock / Checkmark SVG -->
    <path d="M -10 2 L -3 9 L 12 -6" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Content Header Pill -->
  <rect x="460" y="35" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="56" text-anchor="middle" class="badge-text">🛡️ AI SAFETY &amp; SECURITY ECOSYSTEM</text>

  <!-- Title Text -->
  <text x="600" y="215" text-anchor="middle" class="title-text" filter="url(#shadow)">Awesome AI Guardrails</text>

  <!-- Accent Line Below Title -->
  <rect x="450" y="235" width="300" height="4" rx="2" fill="url(#accent-gradient)" />

  <!-- Subtitle Text -->
  <text x="600" y="280" text-anchor="middle" class="subtitle-text">Curated List of SaaS Platforms &amp; Open-Source AI Safety Frameworks</text>

  <!-- Feature Pills at Bottom -->
  <g transform="translate(310, 320)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="80" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cbd5e1">🔒 Prompt Injection</text>

    <rect x="180" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="260" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cbd5e1">⚡ Runtime Control</text>

    <rect x="360" y="0" width="220" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="470" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cbd5e1">🤖 Safe Agent Behavior</text>
  </g>
</svg>
